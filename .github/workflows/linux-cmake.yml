name: CMake Linux

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: CachyOS Clang x86-64-v2
    runs-on: ubuntu-24.04

    container:
      image: cachyos/cachyos:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build tools
        shell: bash
        run: |
          set -eux

          pacman -Syu --noconfirm --needed \
            git \
            cmake \
            ninja \
            clang \
            llvm \
            lld

      - name: Show toolchain
        shell: bash
        run: |
          set -eux

          cat /etc/os-release
          echo
          clang++ --version
          echo
          cmake --version
          echo
          ninja --version

      - name: Configure
        shell: bash
        run: |
          set -eux

          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_STANDARD=23 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_CXX_EXTENSIONS=OFF \
            -DCMAKE_CXX_FLAGS="-march=x86-64-v2" \
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld"

      - name: Build
        shell: bash
        run: |
          set -eux

          cmake \
            --build build \
            --parallel

      - name: Verify
        shell: bash
        run: |
          set -eux

          find build \
            -type f \
            -maxdepth 4 \
            -print

          test -f build/Release/Calc

          file build/Release/Calc
