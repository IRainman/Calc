name: CMake Linux

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}

    runs-on: ubuntu-24.04

    container:
      image: cachyos/cachyos:latest

    strategy:
      fail-fast: false

      matrix:
        include:
          - name: CachyOS Clang x86-64-v2
            compiler: clang
            build_dir: build/clang-x64

          - name: CachyOS GCC x86-64-v2
            compiler: gcc
            build_dir: build/gcc-x64

    steps:

      # ======================================================================
      # Checkout
      # ======================================================================

      - name: Checkout Calc
        uses: actions/checkout@v6

      # ======================================================================
      # Install tools
      # ======================================================================

      - name: Install build tools
        shell: bash
        run: |
          set -eux

          pacman -Syu --noconfirm --needed \
            git \
            cmake \
            ninja \
            clang \
            llvm \
            lld \
            gcc

      # ======================================================================
      # Verify CachyOS
      # ======================================================================

      - name: Verify environment
        shell: bash
        run: |
          set -eux

          echo "========================================"
          echo "Operating system"
          echo "========================================"

          cat /etc/os-release

          echo
          echo "========================================"
          echo "Architecture"
          echo "========================================"

          uname -m

          echo
          echo "========================================"
          echo "CMake"
          echo "========================================"

          cmake --version

          echo
          echo "========================================"
          echo "Ninja"
          echo "========================================"

          ninja --version

      # ======================================================================
      # Verify compiler
      # ======================================================================

      - name: Verify Clang
        if: matrix.compiler == 'clang'
        shell: bash
        run: |
          set -eux

          clang --version
          clang++ --version
          ld.lld --version

      - name: Verify GCC
        if: matrix.compiler == 'gcc'
        shell: bash
        run: |
          set -eux

          gcc --version
          g++ --version

      # ======================================================================
      # Checkout header-only/source dependencies
      # ======================================================================

      - name: Checkout dependencies
        shell: bash
        run: |
          set -eux

          parent="$(dirname "$GITHUB_WORKSPACE")"

          rm -rf \
            "$parent/fast_float" \
            "$parent/fmt" \
            "$parent/zmij"

          git clone \
            --depth 1 \
            --branch main \
            https://github.com/IRainman/fast_float.git \
            "$parent/fast_float"

          git clone \
            --depth 1 \
            --branch main \
            https://github.com/IRainman/fmt.git \
            "$parent/fmt"

          git clone \
            --depth 1 \
            --branch main \
            https://github.com/IRainman/zmij.git \
            "$parent/zmij"

      # ======================================================================
      # Verify dependency layout
      # ======================================================================

      - name: Verify dependencies
        shell: bash
        run: |
          set -eux

          parent="$(dirname "$GITHUB_WORKSPACE")"

          test -f \
            "$parent/fast_float/include/fast_float/fast_float.h"

          test -f \
            "$parent/fmt/include/fmt/compile.h"

          test -f \
            "$parent/zmij/zmij.cc"

      # ======================================================================
      # Configure
      # ======================================================================

      - name: Configure
        shell: bash
        env:
          BUILD_DIR: ${{ matrix.build_dir }}
          COMPILER: ${{ matrix.compiler }}
        run: |
          set -eux

          if [ "$COMPILER" = "clang" ]; then
            c_compiler=clang
            cxx_compiler=clang++
            linker_flags="-fuse-ld=lld"
          else
            c_compiler=gcc
            cxx_compiler=g++
            linker_flags=""
          fi

          cmake \
            -S . \
            -B "$BUILD_DIR" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="$c_compiler" \
            -DCMAKE_CXX_COMPILER="$cxx_compiler" \
            -DCMAKE_C_STANDARD=23 \
            -DCMAKE_C_STANDARD_REQUIRED=ON \
            -DCMAKE_C_EXTENSIONS=OFF \
            -DCMAKE_CXX_STANDARD=23 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_CXX_EXTENSIONS=OFF \
            -DCMAKE_C_FLAGS="-march=x86-64-v2" \
            -DCMAKE_CXX_FLAGS="-march=x86-64-v2" \
            -DCMAKE_EXE_LINKER_FLAGS="$linker_flags"

      # ======================================================================
      # Verify configuration
      # ======================================================================

      - name: Verify CMake configuration
        shell: bash
        env:
          BUILD_DIR: ${{ matrix.build_dir }}
          COMPILER: ${{ matrix.compiler }}
        run: |
          set -eux

          cache="$BUILD_DIR/CMakeCache.txt"

          test -f "$cache"

          echo "========================================"
          echo "Compiler"
          echo "========================================"

          grep 'CMAKE_C_COMPILER_ID:' "$cache"
          grep 'CMAKE_CXX_COMPILER_ID:' "$cache"
          grep 'CMAKE_CXX_COMPILER:' "$cache"

          echo
          echo "========================================"
          echo "C standard"
          echo "========================================"

          grep 'CMAKE_C_STANDARD:' "$cache" || true

          echo
          echo "========================================"
          echo "C++ standard"
          echo "========================================"

          grep 'CMAKE_CXX_STANDARD:' "$cache" || true

          echo
          echo "========================================"
          echo "Pointer size"
          echo "========================================"

          grep 'CMAKE_SIZEOF_VOID_P:' "$cache"

          if [ "$COMPILER" = "clang" ]; then
            grep -q \
              'CMAKE_CXX_COMPILER_ID:.*Clang' \
              "$cache"
          else
            grep -q \
              'CMAKE_CXX_COMPILER_ID:.*GNU' \
              "$cache"
          fi

          grep -q \
            'CMAKE_SIZEOF_VOID_P:INTERNAL=8' \
            "$cache"

      # ======================================================================
      # Build
      # ======================================================================

      - name: Build
        shell: bash
        env:
          BUILD_DIR: ${{ matrix.build_dir }}
        run: |
          set -eux

          cmake \
            --build "$BUILD_DIR" \
            --parallel

      # ======================================================================
      # Verify executable
      # ======================================================================

      - name: Verify executable
        shell: bash
        env:
          BUILD_DIR: ${{ matrix.build_dir }}
        run: |
          set -eux

          executable="$BUILD_DIR/Release/Calc"

          test -f "$executable"

          file "$executable"

      # ======================================================================
      # Upload executable
      # ======================================================================

      - name: Upload executable
        uses: actions/upload-artifact@v6
        with:
          name: Calc-CMake-${{ matrix.compiler }}-x86-64-v2
          path: ${{ matrix.build_dir }}/Release/Calc
          if-no-files-found: error
          retention-days: 14

      # ======================================================================
      # Upload diagnostics
      # ======================================================================

      - name: Upload CMake diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: Calc-CMake-Diagnostics-${{ matrix.compiler }}
          path: |
            ${{ matrix.build_dir }}/CMakeCache.txt
            ${{ matrix.build_dir }}/CMakeFiles/CMakeError.log
            ${{ matrix.build_dir }}/CMakeFiles/CMakeOutput.log
          if-no-files-found: ignore
          retention-days: 14
