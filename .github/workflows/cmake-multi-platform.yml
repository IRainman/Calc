name: CMake Clang Multi-Platform

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:

# Cancel an older run for the same branch/PR.
# Matrix jobs in the same workflow run remain independent.
concurrency:
  group: cmake-clang-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  build:

    name: ${{ matrix.name }}

    strategy:
      fail-fast: false

      matrix:
        include:

          # ================================================================
          # Linux x86-64-v2
          # ================================================================

          - name: Linux Clang x86-64-v2
            os: ubuntu-24.04
            platform: linux
            architecture: x64
            build_dir: build/linux-x64

          # ================================================================
          # Linux 32-bit Prescott / SSE3
          # ================================================================

          - name: Linux Clang x86 SSE3
            os: ubuntu-24.04
            platform: linux
            architecture: x86
            build_dir: build/linux-x86

          # ================================================================
          # Windows x86-64-v2
          # ================================================================

          - name: Windows Clang x86-64-v2
            os: windows-2025-vs2026
            platform: windows
            architecture: x64
            build_dir: build/windows-x64

          # ================================================================
          # Windows 32-bit Prescott / SSE3
          # ================================================================

          - name: Windows Clang x86 SSE3
            os: windows-2025-vs2026
            platform: windows
            architecture: x86
            build_dir: build/windows-x86

    runs-on: ${{ matrix.os }}

    steps:

      # ======================================================================
      # Calc
      # ======================================================================

      - name: Checkout Calc
        uses: actions/checkout@v6

      # ======================================================================
      # Dependencies
      #
      # The Calc checkout is:
      #
      #   <parent>/Calc
      #
      # and pch.hpp requires:
      #
      #   <parent>/zmij
      #   <parent>/fmt
      #   <parent>/fast_float
      # ======================================================================

      - name: Checkout dependencies
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail

          PARENT="$(dirname "$GITHUB_WORKSPACE")"

          echo "Calc workspace:"
          echo "  $GITHUB_WORKSPACE"

          echo "Dependency root:"
          echo "  $PARENT"

          rm -rf \
            "$PARENT/fast_float" \
            "$PARENT/fmt" \
            "$PARENT/zmij"

          git clone \
            --depth 1 \
            --branch main \
            https://github.com/IRainman/fast_float.git \
            "$PARENT/fast_float"

          git clone \
            --depth 1 \
            --branch main \
            https://github.com/IRainman/fmt.git \
            "$PARENT/fmt"

          git clone \
            --depth 1 \
            --branch main \
            https://github.com/IRainman/zmij.git \
            "$PARENT/zmij"

          echo
          echo "Dependency layout:"
          echo "  $PARENT/fast_float"
          echo "  $PARENT/fmt"
          echo "  $PARENT/zmij"

      - name: Verify dependency layout
        shell: bash
        run: |
          set -euo pipefail

          PARENT="$(dirname "$GITHUB_WORKSPACE")"

          test -f \
            "$PARENT/fast_float/include/fast_float/fast_float.h"

          test -f \
            "$PARENT/fmt/include/fmt/compile.h"

          test -f \
            "$PARENT/zmij/zmij.cc"

          echo "Dependency layout is correct."

      # ======================================================================
      # Linux toolchain
      # ======================================================================

      - name: Install Linux Clang toolchain
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail

          sudo dpkg --add-architecture i386

          sudo apt-get update

          sudo apt-get install -y \
            clang \
            lld \
            libc++-dev \
            libc++abi-dev \
            libc6-dev-i386 \
            linux-libc-dev:i386 \
            ninja-build

          sudo apt-get install -y \
            libc++-dev:i386 \
            libc++abi-dev:i386

      # ======================================================================
      # Linux toolchain verification
      # ======================================================================

      - name: Verify Linux Clang
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail

          echo "=== clang ==="
          clang --version

          echo
          echo "=== clang++ ==="
          clang++ --version

          echo
          echo "=== lld ==="
          ld.lld --version

          echo
          echo "=== cmake ==="
          cmake --version

          echo
          echo "=== ninja ==="
          ninja --version

      # ======================================================================
      # Windows SDK
      #
      # We need the Windows SDK and system libraries for clang++/lld-link.
      #
      # We do NOT invoke cl.exe.
      # ======================================================================

      - name: Locate Windows SDK environment
        if: matrix.platform == 'windows'
        id: windows_sdk
        shell: pwsh
        run: |
          $vswhere =
            "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe not found: $vswhere"
          }

          $installationPath = & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          if ($LASTEXITCODE -ne 0) {
            throw "Unable to locate Visual Studio installation."
          }

          $installationPath = $installationPath.Trim()

          $vsdevcmd = Join-Path `
            $installationPath `
            "Common7\Tools\VsDevCmd.bat"

          if (-not (Test-Path $vsdevcmd)) {
            throw "VsDevCmd.bat not found: $vsdevcmd"
          }

          "VSDEVCMD=$vsdevcmd" >> $env:GITHUB_OUTPUT

          Write-Host "Visual Studio environment:"
          Write-Host "  $installationPath"

      # ======================================================================
      # Windows LLVM verification
      # ======================================================================

      - name: Verify Windows Clang
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $clang = Get-Command clang++.exe -ErrorAction SilentlyContinue
          $lld = Get-Command lld-link.exe -ErrorAction SilentlyContinue
          $llvmRc = Get-Command llvm-rc.exe -ErrorAction SilentlyContinue

          if (-not $clang) {
            throw "clang++.exe was not found."
          }

          if (-not $lld) {
            throw "lld-link.exe was not found."
          }

          if (-not $llvmRc) {
            throw "llvm-rc.exe was not found."
          }

          Write-Host "=== clang++ ==="
          clang++.exe --version

          Write-Host ""
          Write-Host "=== lld-link ==="
          lld-link.exe --version

          Write-Host ""
          Write-Host "=== llvm-rc ==="
          llvm-rc.exe /?

          Write-Host ""
          Write-Host "=== cmake ==="
          cmake --version

          Write-Host ""
          Write-Host "=== ninja ==="
          ninja --version

      # ======================================================================
      # Linux configure
      # ======================================================================

      - name: Configure Linux
        if: matrix.platform == 'linux'
        shell: bash
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          BUILD_DIR: ${{ matrix.build_dir }}
        run: |
          set -euo pipefail

          if [ "$ARCHITECTURE" = "x64" ]; then
            TARGET_FLAGS="-march=x86-64-v2"
            STD_LIB="-stdlib=libc++"
          elif [ "$ARCHITECTURE" = "x86" ]; then
            TARGET_FLAGS="-march=prescott -m32"
            STD_LIB="-stdlib=libc++"
          else
            echo "Unsupported architecture: $ARCHITECTURE"
            exit 1
          fi

          cmake \
            -S . \
            -B "$BUILD_DIR" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_FLAGS="$TARGET_FLAGS $STD_LIB" \
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld $STD_LIB" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fuse-ld=lld $STD_LIB"

      # ======================================================================
      # Windows configure
      #
      # clang++ is used instead of clang-cl.
      #
      # This keeps the CMake configuration GNU-style and allows:
      #
      #   -march=...
      #   -flto
      #   -fuse-ld=lld-link
      #
      # while targeting the Windows/MSVC ABI.
      # ======================================================================

      - name: Configure Windows
        if: matrix.platform == 'windows'
        shell: cmd
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          BUILD_DIR: ${{ matrix.build_dir }}
          VSDEVCMD: ${{ steps.windows_sdk.outputs.VSDEVCMD }}
        run: |
          call "%VSDEVCMD%" -arch=%ARCHITECTURE% -host_arch=x64

          echo.
          echo ========================================
          echo Windows Clang environment
          echo ========================================
          echo.

          where clang++.exe
          where lld-link.exe
          where llvm-rc.exe
          where ninja.exe
          where cmake.exe

          echo.
          echo ========================================
          echo Clang
          echo ========================================
          clang++.exe --version

          echo.
          echo ========================================
          echo CMake
          echo ========================================
          cmake --version

          echo.
          echo ========================================
          echo Ninja
          echo ========================================
          ninja --version

          echo.
          echo ========================================
          echo CMake configure
          echo ========================================

          if /I "%ARCHITECTURE%"=="x64" (
            set "TARGET=x86_64-pc-windows-msvc"
            set "ARCH_FLAGS=-march=x86-64-v2"
          ) else if /I "%ARCHITECTURE%"=="x86" (
            set "TARGET=i686-pc-windows-msvc"
            set "ARCH_FLAGS=-march=prescott"
          ) else (
            echo ERROR: Unsupported architecture: %ARCHITECTURE%
            exit /b 1
          )

          clang++.exe ^
            --target=%TARGET% ^
            %ARCH_FLAGS% ^
            -fuse-ld=lld-link ^
            -v ^
            -x c++ ^
            -E ^
            NUL ^
            > nul

          if errorlevel 1 (
            echo ERROR: Clang target configuration failed.
            exit /b 1
          )

          cmake ^
            -S . ^
            -B "%BUILD_DIR%" ^
            -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_C_COMPILER=clang.exe ^
            -DCMAKE_CXX_COMPILER=clang++.exe ^
            -DCMAKE_C_COMPILER_TARGET=%TARGET% ^
            -DCMAKE_CXX_COMPILER_TARGET=%TARGET% ^
            -DCMAKE_LINKER=lld-link.exe ^
            -DCMAKE_RC_COMPILER=llvm-rc.exe ^
            -DCMAKE_C_FLAGS="%ARCH_FLAGS%" ^
            -DCMAKE_CXX_FLAGS="%ARCH_FLAGS%" ^
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld-link" ^
            -DCMAKE_SHARED_LINKER_FLAGS="-fuse-ld=lld-link"

          if errorlevel 1 (
            echo ERROR: CMake configuration failed.
            exit /b 1
          )

      # ======================================================================
      # Verify compiler selected by CMake
      # ======================================================================

      - name: Verify CMake compiler
        shell: bash
        env:
          BUILD_DIR: ${{ matrix.build_dir }}
        run: |
          set -euo pipefail

          echo "=== Compiler ID ==="

          grep \
            'CMAKE_CXX_COMPILER_ID:' \
            "$BUILD_DIR/CMakeCache.txt" || true

          echo
          echo "=== Compiler ==="

          grep \
            'CMAKE_CXX_COMPILER:' \
            "$BUILD_DIR/CMakeCache.txt" || true

          echo
          echo "=== Compiler target ==="

          grep \
            'CMAKE_CXX_COMPILER_TARGET:' \
            "$BUILD_DIR/CMakeCache.txt" || true

          if ! grep -q \
              'CMAKE_CXX_COMPILER_ID:.*Clang' \
              "$BUILD_DIR/CMakeCache.txt"; then

            echo "ERROR: CMake did not select Clang."
            exit 1
          fi

          echo
          echo "Clang compiler confirmed."

      # ======================================================================
      # Build
      # ======================================================================

      - name: Build
        shell: bash
        env:
          BUILD_DIR: ${{ matrix.build_dir }}
        run: |
          set -euo pipefail

          cmake \
            --build "$BUILD_DIR" \
            --parallel

      # ======================================================================
      # Verify Linux output
      # ======================================================================

      - name: Verify Linux executable
        if: matrix.platform == 'linux'
        shell: bash
        env:
          BUILD_DIR: ${{ matrix.build_dir }}
        run: |
          set -euo pipefail

          EXECUTABLE="$BUILD_DIR/Release/Calc"

          if [ ! -f "$EXECUTABLE" ]; then

            echo "ERROR: Calc executable was not produced:"
            echo "  $EXECUTABLE"

            echo
            echo "Build tree:"
            find "$BUILD_DIR" -maxdepth 4 -type f -print

            exit 1
          fi

          echo "Calc:"
          file "$EXECUTABLE"

      # ======================================================================
      # Verify Windows output
      # ======================================================================

      - name: Verify Windows executable
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          BUILD_DIR: ${{ matrix.build_dir }}
        run: |
          $executables = @(
            Get-ChildItem `
              -Path $env:BUILD_DIR `
              -Filter "Calc.exe" `
              -Recurse `
              -File
          )

          if ($executables.Count -eq 0) {

            Write-Host "Build tree:"
            Get-ChildItem `
              -Path $env:BUILD_DIR `
              -Recurse `
              -File

            throw "Calc.exe was not produced."
          }

          Write-Host "Calc executable(s):"

          foreach ($file in $executables) {
            Write-Host ""
            Write-Host "  $($file.FullName)"
            Write-Host "  Size: $($file.Length)"
          }

      # ======================================================================
      # Artifacts
      # ======================================================================

      - name: Upload Linux executable
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v6
        with:
          name: Calc-CMake-Clang-Linux-${{ matrix.architecture }}
          path: |
            ${{ matrix.build_dir }}/Release/Calc
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows executable
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v6
        with:
          name: Calc-CMake-Clang-Windows-${{ matrix.architecture }}
          path: |
            ${{ matrix.build_dir }}/**/Calc.exe
          if-no-files-found: error
          retention-days: 14

      # ======================================================================
      # Diagnostics
      # ======================================================================

      - name: Upload CMake diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: Calc-CMake-Diagnostics-${{ matrix.platform }}-${{ matrix.architecture }}
          path: |
            ${{ matrix.build_dir }}/CMakeCache.txt
            ${{ matrix.build_dir }}/CMakeFiles/CMakeError.log
            ${{ matrix.build_dir }}/CMakeFiles/CMakeOutput.log
          if-no-files-found: ignore
          retention-days: 14
