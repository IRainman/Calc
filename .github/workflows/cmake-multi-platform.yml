name: CMake - Clang Multi-Platform

on:
  push:
    branches:
      - master

  pull_request:

  workflow_dispatch:

# Cancel older runs for the same branch/PR.
# Matrix configurations within one run remain independent.
concurrency:
  group: cmake-clang-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}

    strategy:
      fail-fast: false

      matrix:
        include:

          # ==========================================================
          # Linux x86-64
          # ==========================================================

          - name: Linux Clang x86-64-v2
            os: ubuntu-24.04
            platform: linux
            arch: x64
            build_dir: build-linux-x64
            architecture: x86-64-v2

          # ==========================================================
          # Linux 32-bit
          # ==========================================================

          - name: Linux Clang x86 SSE3
            os: ubuntu-24.04
            platform: linux
            arch: x86
            build_dir: build-linux-x86
            architecture: x86-sse3

          # ==========================================================
          # Windows x86-64
          #
          # clang-cl + lld-link
          #
          # The Visual Studio environment is used only to provide
          # Windows SDK headers/libraries. The C++ compiler is Clang.
          # ==========================================================

          - name: Windows Clang x86-64-v2
            os: windows-2025-vs2026
            platform: windows
            arch: x64
            build_dir: build-windows-x64
            architecture: x86-64-v2

          # ==========================================================
          # Windows 32-bit
          #
          # clang-cl + lld-link + -m32
          # ==========================================================

          - name: Windows Clang x86 SSE3
            os: windows-2025-vs2026
            platform: windows
            arch: x86
            build_dir: build-windows-x86
            architecture: x86-sse3

    runs-on: ${{ matrix.os }}

    steps:

      # ==========================================================
      # Checkout
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v6

      # ==========================================================
      # Linux LLVM packages
      # ==========================================================

      - name: Enable Linux i386 architecture
        if: matrix.platform == 'linux' && matrix.arch == 'x86'
        shell: bash
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update

      - name: Install Linux Clang toolchain
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            clang \
            lld \
            ninja-build \
            cmake \
            libc++-dev \
            libc++abi-dev

      - name: Install Linux 32-bit C++ runtime
        if: matrix.platform == 'linux' && matrix.arch == 'x86'
        shell: bash
        run: |
          sudo apt-get install -y \
            libc6-dev:i386 \
            linux-libc-dev:i386 \
            libc++-dev:i386 \
            libc++abi-dev:i386

      # ==========================================================
      # Verify Linux LLVM toolchain
      # ==========================================================

      - name: Verify Linux toolchain
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          echo "=== clang ==="
          clang --version

          echo
          echo "=== clang++ ==="
          clang++ --version

          echo
          echo "=== lld ==="
          ld.lld --version

          echo
          echo "=== cmake ==="
          cmake --version

          echo
          echo "=== ninja ==="
          ninja --version

      # ==========================================================
      # Windows: locate Visual Studio environment
      #
      # This is NOT used to compile with MSVC.
      #
      # clang-cl needs the Windows SDK / system libraries for the
      # Windows target. We use VsDevCmd only to expose those paths.
      # ==========================================================

      - name: Locate Visual Studio
        if: matrix.platform == 'windows'
        id: vs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe was not found: $vswhere"
          }

          $installationPath = & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          if ($LASTEXITCODE -ne 0 -or `
              [string]::IsNullOrWhiteSpace($installationPath)) {
            throw "Visual Studio with Windows C++ SDK support was not found."
          }

          $installationPath = $installationPath.Trim()

          $vsdevcmd = Join-Path `
            $installationPath `
            "Common7\Tools\VsDevCmd.bat"

          if (-not (Test-Path $vsdevcmd)) {
            throw "VsDevCmd.bat was not found: $vsdevcmd"
          }

          "VS_INSTALL=$installationPath" >> $env:GITHUB_ENV
          "VSDEVCMD=$vsdevcmd" >> $env:GITHUB_ENV

          Write-Host "Visual Studio environment:"
          Write-Host "  $installationPath"

      # ==========================================================
      # Windows: initialize the correct target architecture
      #
      # We do NOT invoke cl.exe.
      #
      # x64:
      #   VsDevCmd -arch=x64
      #
      # x86:
      #   VsDevCmd -arch=x86
      #
      # This supplies the correct SDK/library search paths to
      # clang-cl/lld-link.
      # ==========================================================

      - name: Initialize Windows SDK environment
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          if ($env:ARCH -eq "x64") {
            $targetArch = "x64"
          }
          elseif ($env:ARCH -eq "x86") {
            $targetArch = "x86"
          }
          else {
            throw "Unsupported architecture: $env:ARCH"
          }

          $output = cmd /c `
            "`"$env:VSDEVCMD`" -arch=$targetArch -host_arch=x64 && set"

          foreach ($line in $output) {
            if ($line -match '^([^=]+)=(.*)$') {
              $name = $matches[1]
              $value = $matches[2]

              "$name=$value" >> $env:GITHUB_ENV
            }
          }

          Write-Host "Windows SDK environment initialized for $targetArch."

      # ==========================================================
      # Locate LLVM on Windows
      # ==========================================================

      - name: Locate LLVM
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $clangCl = Get-Command clang-cl.exe -ErrorAction SilentlyContinue
          $clang = Get-Command clang.exe -ErrorAction SilentlyContinue
          $lldLink = Get-Command lld-link.exe -ErrorAction SilentlyContinue
          $llvmRc = Get-Command llvm-rc.exe -ErrorAction SilentlyContinue

          if (-not $clangCl) {
            throw "clang-cl.exe was not found."
          }

          if (-not $clang) {
            throw "clang.exe was not found."
          }

          if (-not $lldLink) {
            throw "lld-link.exe was not found."
          }

          if (-not $llvmRc) {
            throw "llvm-rc.exe was not found."
          }

          Write-Host "clang-cl:"
          Write-Host "  $($clangCl.Source)"

          Write-Host "clang:"
          Write-Host "  $($clang.Source)"

          Write-Host "lld-link:"
          Write-Host "  $($lldLink.Source)"

          Write-Host "llvm-rc:"
          Write-Host "  $($llvmRc.Source)"

          $llvmBin = Split-Path -Parent $clangCl.Source

          "LLVM_BIN=$llvmBin" >> $env:GITHUB_ENV

      - name: Verify Windows LLVM toolchain
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Write-Host "=== clang-cl ==="
          clang-cl.exe --version

          Write-Host ""
          Write-Host "=== lld-link ==="
          lld-link.exe --version

          Write-Host ""
          Write-Host "=== llvm-rc ==="
          llvm-rc.exe /?

          Write-Host ""
          Write-Host "=== cmake ==="
          cmake --version

          Write-Host ""
          Write-Host "=== ninja ==="
          ninja --version

      # ==========================================================
      # Architecture-specific CMake flags
      # ==========================================================

      - name: Configure Linux CMake
        if: matrix.platform == 'linux'
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          BUILD_DIR: ${{ matrix.build_dir }}
        run: |
          if [ "$ARCH" = "x64" ]; then
            export CFLAGS="-march=x86-64-v2"
            export CXXFLAGS="-march=x86-64-v2"
          elif [ "$ARCH" = "x86" ]; then
            export CFLAGS="-m32"
            export CXXFLAGS="-m32"
          else
            echo "Unsupported architecture: $ARCH"
            exit 1
          fi

          cmake \
            -S . \
            -B "$BUILD_DIR" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_FLAGS="$CXXFLAGS" \
            -DCMAKE_C_FLAGS="$CFLAGS" \
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld" \
            -DCMAKE_CXX_FLAGS_RELEASE="-O3 -flto -stdlib=libc++" \
            -DCMAKE_CXX_FLAGS_DEBUG="-O0 -g -Wall -Wextra -stdlib=libc++"

      # ==========================================================
      # Windows CMake
      # ==========================================================

      - name: Configure Windows CMake
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          ARCH: ${{ matrix.arch }}
          BUILD_DIR: ${{ matrix.build_dir }}
        run: |
          $common = @(
            "-S", ".",
            "-B", $env:BUILD_DIR,
            "-G", "Ninja",
            "-DCMAKE_C_COMPILER=clang-cl.exe",
            "-DCMAKE_CXX_COMPILER=clang-cl.exe",
            "-DCMAKE_LINKER=lld-link.exe",
            "-DCMAKE_RC_COMPILER=llvm-rc.exe",
            "-DCMAKE_BUILD_TYPE=Release",
            "-DCMAKE_CXX_STANDARD=23",
            "-DCMAKE_CXX_STANDARD_REQUIRED=ON",
            "-DCMAKE_CXX_EXTENSIONS=OFF",
            "-DCMAKE_CXX_FLAGS_RELEASE=-O3 -flto",
            "-DCMAKE_CXX_FLAGS_DEBUG=-O0 -g -Wall -Wextra",
            "-DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld"
          )

          if ($env:ARCH -eq "x64") {
            $common += "-DCMAKE_C_FLAGS=-march=x86-64-v2"
            $common += "-DCMAKE_CXX_FLAGS=-march=x86-64-v2"
          }
          elseif ($env:ARCH -eq "x86") {
            #
            # Ninja + clang-cl needs the target architecture supplied
            # before compiler detection. This is why the workflow uses
            # CMAKE_C_FLAGS/CMAKE_CXX_FLAGS here.
            #
            $common += "-DCMAKE_C_FLAGS=-m32"
            $common += "-DCMAKE_CXX_FLAGS=-m32"
          }
          else {
            throw "Unsupported architecture: $env:ARCH"
          }

          cmake @common

      # ==========================================================
      # Verify CMake selected Clang
      # ==========================================================

      - name: Verify CMake compiler
        shell: bash
        env:
          BUILD_DIR: ${{ matrix.build_dir }}
        run: |
          echo "=== Compiler information ==="

          grep -E \
            '^(CMAKE_(C|CXX)_COMPILER:|CMAKE_(C|CXX)_COMPILER_ID:|CMAKE_(C|CXX)_COMPILER_VERSION:|CMAKE_LINKER:)' \
            "$BUILD_DIR/CMakeCache.txt" || true

          echo
          echo "=== Compiler ID check ==="

          if ! grep -q 'CMAKE_CXX_COMPILER_ID:.*Clang' \
              "$BUILD_DIR/CMakeCache.txt"; then
            echo "ERROR: CMake is not using Clang."
            exit 1
          fi

          echo "Clang compiler confirmed."

      # ==========================================================
      # Build
      # ==========================================================

      - name: Build
        shell: bash
        env:
          BUILD_DIR: ${{ matrix.build_dir }}
        run: |
          cmake \
            --build "$BUILD_DIR" \
            --config Release \
            --parallel

      # ==========================================================
      # Verify executable
      # ==========================================================

      - name: Verify Linux executable
        if: matrix.platform == 'linux'
        shell: bash
        env:
          BUILD_DIR: ${{ matrix.build_dir }}
          ARCH: ${{ matrix.arch }}
        run: |
          executable="$BUILD_DIR/Release/Calc"

          if [ ! -f "$executable" ]; then
            echo "ERROR: Calc executable was not produced:"
            echo "  $executable"
            find "$BUILD_DIR" -maxdepth 4 -type f -print
            exit 1
          fi

          echo "Executable:"
          file "$executable"

          echo
          echo "ELF architecture:"
          readelf -h "$executable" |
            grep -E 'Class:|Machine:'

      - name: Verify Windows executable
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          BUILD_DIR: ${{ matrix.build_dir }}
        run: |
          $exe = Get-ChildItem `
            -Path $env:BUILD_DIR `
            -Filter "Calc.exe" `
            -Recurse `
            -File

          if (-not $exe) {
            Write-Host "Build tree:"
            Get-ChildItem `
              -Path $env:BUILD_DIR `
              -Recurse `
              -File

            throw "Calc.exe was not produced."
          }

          Write-Host "Executable:"
          foreach ($file in $exe) {
            Write-Host "  $($file.FullName)"
            Write-Host "  Size: $($file.Length)"
          }

      # ==========================================================
      # Upload executable
      # ==========================================================

      - name: Upload Linux executable
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v6
        with:
          name: Calc-Linux-Clang-${{ matrix.arch }}
          path: |
            ${{ matrix.build_dir }}/Release/Calc
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows executable
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v6
        with:
          name: Calc-Windows-Clang-${{ matrix.arch }}
          path: |
            ${{ matrix.build_dir }}/**/Calc.exe
          if-no-files-found: error
          retention-days: 14

      # ==========================================================
      # Upload diagnostics on failure
      # ==========================================================

      - name: Upload CMake diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: Calc-CMake-Diagnostics-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            ${{ matrix.build_dir }}/CMakeCache.txt
            ${{ matrix.build_dir }}/CMakeFiles/CMakeError.log
            ${{ matrix.build_dir }}/CMakeFiles/CMakeOutput.log
          if-no-files-found: ignore
          retention-days: 14